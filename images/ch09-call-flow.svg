<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:24px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:36px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">SYNCHRONOUS CALL</text><text x="700" y="145" class="t h" text-anchor="middle">同步调用与响应提取</text><text x="700" y="184" class="t s" text-anchor="middle">请求线程等待模型完成，再按业务需要取得文本、完整响应或实体</text><g transform="translate(80,285)"><rect width="230" height="130" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="115" y="55" class="t b" text-anchor="middle">RequestSpec</text><text x="115" y="88" class="t d" text-anchor="middle">消息与选项</text></g><text x="335" y="365" class="t a">→</text><g transform="translate(390,285)"><rect width="230" height="130" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="115" y="55" class="t b" text-anchor="middle">call()</text><text x="115" y="88" class="t d" text-anchor="middle">选择同步路径</text></g><text x="645" y="365" class="t a">→</text><g transform="translate(700,285)"><rect width="230" height="130" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="115" y="55" class="t b" text-anchor="middle">ChatModel</text><text x="115" y="88" class="t d" text-anchor="middle">等待远程响应</text></g><text x="955" y="365" class="t a">→</text><g transform="translate(1010,285)"><rect width="300" height="130" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="150" y="48" class="t b" text-anchor="middle">ResponseSpec</text><text x="150" y="82" class="t d" text-anchor="middle">content / chatResponse</text><text x="150" y="108" class="t d" text-anchor="middle">entity</text></g><rect x="170" y="515" width="1060" height="100" rx="16" fill="#f1f5f9"/><text x="700" y="557" class="t b" text-anchor="middle">同步不等于简单，也不等于低并发</text><text x="700" y="592" class="t d" text-anchor="middle">线程等待期间仍需设置超时、错误映射、限流与日志边界</text><text x="700" y="730" class="t s" text-anchor="middle">第 09 章 · 同步调用 call()</text></svg>
