<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">DashScope 流式 SSE 调用链</text><text x="800" y="94" text-anchor="middle" class="sub">WebClient 建立长连接，文本事件解析为 Chunk，再转换为 ChatResponse 流</text>
<rect x="50" y="175" width="260" height="160" rx="18" class="blue"/><text x="180" y="220" text-anchor="middle" class="h">Stream Request</text><text x="180" y="260" text-anchor="middle" class="b">stream = true</text><text x="180" y="298" text-anchor="middle" class="tag">incrementalOutput</text>
<rect x="350" y="175" width="260" height="160" rx="18" class="green"/><text x="480" y="220" text-anchor="middle" class="h">WebClient POST</text><text x="480" y="260" text-anchor="middle" class="b">SSE Header</text><text x="480" y="298" text-anchor="middle" class="tag">异步长连接</text>
<rect x="650" y="175" width="260" height="160" rx="18" class="box"/><text x="780" y="220" text-anchor="middle" class="h">Flux&lt;String&gt;</text><text x="780" y="260" text-anchor="middle" class="b">过滤结束标记</text><text x="780" y="298" text-anchor="middle" class="tag">解析错误或 Chunk</text>
<rect x="950" y="175" width="280" height="160" rx="18" class="box"/><text x="1090" y="220" text-anchor="middle" class="h">Tool Chunk Merger</text><text x="1090" y="260" text-anchor="middle" class="b">合并分片函数参数</text><text x="1090" y="298" text-anchor="middle" class="tag">windowUntil</text>
<rect x="1270" y="175" width="280" height="160" rx="18" class="blue"/><text x="1410" y="220" text-anchor="middle" class="h">Flux&lt;ChatResponse&gt;</text><text x="1410" y="260" text-anchor="middle" class="b">Chunk → Completion</text><text x="1410" y="298" text-anchor="middle" class="tag">Spring AI 输出</text>
<path d="M310 255H340" class="arr"/><path d="M610 255H640" class="arr"/><path d="M910 255H940" class="arr"/><path d="M1230 255H1260" class="arr"/>
<rect x="245" y="470" width="330" height="150" rx="18" class="box"/><text x="410" y="515" text-anchor="middle" class="h">完成</text><text x="410" y="555" text-anchor="middle" class="b">[DONE] / complete</text><text x="410" y="590" text-anchor="middle" class="tag">停止 Observation</text>
<rect x="635" y="470" width="330" height="150" rx="18" class="box"/><text x="800" y="515" text-anchor="middle" class="h">错误</text><text x="800" y="555" text-anchor="middle" class="b">HTTP / JSON / Provider Error</text><text x="800" y="590" text-anchor="middle" class="tag">error signal</text>
<rect x="1025" y="470" width="330" height="150" rx="18" class="box"/><text x="1190" y="515" text-anchor="middle" class="h">取消</text><text x="1190" y="555" text-anchor="middle" class="b">客户端断开或主动 cancel</text><text x="1190" y="590" text-anchor="middle" class="tag">释放连接</text>
<rect x="250" y="680" width="1100" height="48" rx="12" fill="#e2e8f0"/><text x="800" y="711" text-anchor="middle" class="b">Chunk 不是 Token；工具参数可能跨多个事件，必须先合并再执行，不能逐片段调用工具</text></svg>
