<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">pushAll()：Advisor 分类、入栈与重排</text>
  <text x="800" y="94" text-anchor="middle" class="sub">一个 Advisor 可以同时进入 Call Chain 与 Stream Chain</text>
  <rect x="70" y="245" width="300" height="165" rx="18" class="blue"/><text x="220" y="290" text-anchor="middle" class="h">List&lt;? extends Advisor&gt;</text><text x="220" y="330" text-anchor="middle" class="b">统一输入集合</text><text x="220" y="368" text-anchor="middle" class="tag">null 校验</text>
  <rect x="460" y="145" width="320" height="150" rx="18" class="box"/><text x="620" y="190" text-anchor="middle" class="h">instanceof CallAdvisor</text><text x="620" y="230" text-anchor="middle" class="b">筛选并转换</text><text x="620" y="264" text-anchor="middle" class="tag">callAdvisors.push()</text>
  <rect x="460" y="390" width="320" height="150" rx="18" class="box"/><text x="620" y="435" text-anchor="middle" class="h">instanceof StreamAdvisor</text><text x="620" y="475" text-anchor="middle" class="b">筛选并转换</text><text x="620" y="509" text-anchor="middle" class="tag">streamAdvisors.push()</text>
  <path d="M370 327H415V220H450" class="arr"/><path d="M370 327H415V465H450" class="arr"/>
  <rect x="890" y="245" width="300" height="165" rx="18" class="blue"/><text x="1040" y="290" text-anchor="middle" class="h">reOrder()</text><text x="1040" y="330" text-anchor="middle" class="b">OrderComparator.sort</text><text x="1040" y="368" text-anchor="middle" class="tag">按 order 重建 Deque</text>
  <path d="M780 220H835V300H880" class="arr"/><path d="M780 465H835V355H880" class="arr"/>
  <rect x="1280" y="145" width="250" height="150" rx="18" class="green"/><text x="1405" y="190" text-anchor="middle" class="h">Call Deque</text><text x="1405" y="230" text-anchor="middle" class="b">同步责任链</text><text x="1405" y="264" text-anchor="middle" class="tag">nextCall()</text>
  <rect x="1280" y="390" width="250" height="150" rx="18" class="green"/><text x="1405" y="435" text-anchor="middle" class="h">Stream Deque</text><text x="1405" y="475" text-anchor="middle" class="b">流式责任链</text><text x="1405" y="509" text-anchor="middle" class="tag">nextStream()</text>
  <path d="M1190 300H1235V220H1270" class="arr"/><path d="M1190 355H1235V465H1270" class="arr"/>
  <rect x="290" y="630" width="1020" height="70" rx="14" fill="#e2e8f0"/><text x="800" y="673" text-anchor="middle" class="b">同时实现 CallAdvisor 与 StreamAdvisor → 被两次类型筛选命中 → 分别进入两条独立 Deque</text>
</svg>
