<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:34px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">MODEL CONTEXT PROTOCOL</text><text x="700" y="145" class="t h" text-anchor="middle">MCP Client 与 MCP Server 的能力协商</text><text x="700" y="184" class="t s" text-anchor="middle">协议统一发现与调用方式，权限、安全和业务正确性仍由系统负责</text><g transform="translate(70,300)"><rect width="250" height="140" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="125" y="48" class="t b" text-anchor="middle">AI Application</text><text x="125" y="82" class="t d" text-anchor="middle">ChatClient / Agent</text></g><text x="350" y="380" class="t a">→</text><g transform="translate(410,300)"><rect width="250" height="140" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="125" y="48" class="t b" text-anchor="middle">MCP Client</text><text x="125" y="82" class="t d" text-anchor="middle">连接、发现、调用</text></g><text x="690" y="380" class="t a">⇄</text><g transform="translate(760,300)"><rect width="250" height="140" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="125" y="48" class="t b" text-anchor="middle">MCP Server</text><text x="125" y="82" class="t d" text-anchor="middle">标准化暴露能力</text></g><text x="1040" y="380" class="t a">→</text><g transform="translate(1100,285)"><rect width="235" height="170" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="118" y="42" class="t b" text-anchor="middle">Capabilities</text><text x="118" y="78" class="t d" text-anchor="middle">Tools</text><text x="118" y="108" class="t d" text-anchor="middle">Resources</text><text x="118" y="138" class="t d" text-anchor="middle">Prompts</text></g><rect x="175" y="535" width="1050" height="100" rx="16" fill="#f1f5f9"/><text x="700" y="575" class="t b" text-anchor="middle">远程 MCP Server 属于外部信任边界</text><text x="700" y="610" class="t d" text-anchor="middle">连接前审核来源、权限、可见工具和数据范围，高风险操作必须再次确认</text><text x="700" y="730" class="t s" text-anchor="middle">第 18 章 · MCP</text></svg>
