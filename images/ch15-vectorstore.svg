<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:23px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:34px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">VECTOR STORE</text><text x="700" y="145" class="t h" text-anchor="middle">向量写入与相似度检索</text><text x="700" y="184" class="t s" text-anchor="middle">向量负责语义距离，Metadata 负责确定性过滤和业务追踪</text><g transform="translate(65,290)"><rect width="250" height="140" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="125" y="50" class="t b" text-anchor="middle">Document</text><text x="125" y="84" class="t d" text-anchor="middle">text + metadata</text></g><text x="340" y="375" class="t a">→</text><g transform="translate(395,290)"><rect width="250" height="140" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="125" y="50" class="t b" text-anchor="middle">EmbeddingModel</text><text x="125" y="84" class="t d" text-anchor="middle">生成向量</text></g><text x="670" y="375" class="t a">→</text><g transform="translate(725,290)"><rect width="250" height="140" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="125" y="50" class="t b" text-anchor="middle">VectorStore</text><text x="125" y="84" class="t d" text-anchor="middle">向量 + 原文 + 元数据</text></g><text x="1000" y="375" class="t a">→</text><g transform="translate(1055,290)"><rect width="280" height="140" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="140" y="44" class="t b" text-anchor="middle">Similarity Search</text><text x="140" y="78" class="t d" text-anchor="middle">TopK + Filter</text><text x="140" y="108" class="t d" text-anchor="middle">返回相关 Document</text></g><rect x="180" y="520" width="1040" height="100" rx="16" fill="#f1f5f9"/><text x="700" y="560" class="t b" text-anchor="middle">检索结果不是最终答案</text><text x="700" y="595" class="t d" text-anchor="middle">它只是最相似的候选文档，还需要权限过滤、重排和质量评估</text><text x="700" y="730" class="t s" text-anchor="middle">第 15 章 · VectorStore</text></svg>
