<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:23px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:34px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">EMBEDDING</text><text x="700" y="145" class="t h" text-anchor="middle">文本如何变成可比较的向量</text><text x="700" y="184" class="t s" text-anchor="middle">语义相近的文本在向量空间中通常更接近</text><g transform="translate(70,300)"><rect width="260" height="130" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="130" y="50" class="t b" text-anchor="middle">文本</text><text x="130" y="84" class="t d" text-anchor="middle">“如何申请退款”</text></g><text x="355" y="380" class="t a">→</text><g transform="translate(410,300)"><rect width="260" height="130" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="130" y="50" class="t b" text-anchor="middle">EmbeddingModel</text><text x="130" y="84" class="t d" text-anchor="middle">语义编码</text></g><text x="695" y="380" class="t a">→</text><g transform="translate(750,300)"><rect width="280" height="130" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="140" y="50" class="t b" text-anchor="middle">向量</text><text x="140" y="84" class="t d" text-anchor="middle">[0.12, -0.43, ...]</text></g><text x="1055" y="380" class="t a">→</text><g transform="translate(1110,300)"><rect width="220" height="130" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="110" y="50" class="t b" text-anchor="middle">相似度</text><text x="110" y="84" class="t d" text-anchor="middle">检索相近语义</text></g><rect x="180" y="520" width="1040" height="100" rx="16" fill="#f1f5f9"/><text x="700" y="560" class="t b" text-anchor="middle">向量没有可直接阅读的业务含义</text><text x="700" y="595" class="t d" text-anchor="middle">模型、维度和归一化方式必须保持一致，距离阈值需要基于真实数据评估</text><text x="700" y="730" class="t s" text-anchor="middle">第 14 章 · Embedding</text></svg>
