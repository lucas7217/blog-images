<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">ChatModelStreamAdvisor：流式责任链终点</text>
  <text x="800" y="94" text-anchor="middle" class="sub">Prompt 进入 ChatModel.stream()，响应片段映射并切换到 boundedElastic 下游调度</text>
  <rect x="65" y="205" width="285" height="165" rx="18" class="blue"/><text x="208" y="250" text-anchor="middle" class="h">ChatClientRequest</text><text x="208" y="290" text-anchor="middle" class="b">Prompt + Context</text><text x="208" y="328" text-anchor="middle" class="tag">adviseStream()</text>
  <rect x="410" y="205" width="280" height="165" rx="18" class="green"/><text x="550" y="250" text-anchor="middle" class="h">ChatModel.stream()</text><text x="550" y="290" text-anchor="middle" class="b">模型流式执行</text><text x="550" y="328" text-anchor="middle" class="tag">Flux&lt;ChatResponse&gt;</text>
  <rect x="750" y="205" width="280" height="165" rx="18" class="box"/><text x="890" y="250" text-anchor="middle" class="h">map(...)</text><text x="890" y="290" text-anchor="middle" class="b">复制 Context 并包装</text><text x="890" y="328" text-anchor="middle" class="tag">Flux&lt;ChatClientResponse&gt;</text>
  <rect x="1090" y="205" width="370" height="165" rx="18" class="blue"/><text x="1275" y="250" text-anchor="middle" class="h">publishOn(boundedElastic)</text><text x="1275" y="290" text-anchor="middle" class="b">切换后续信号处理线程</text><text x="1275" y="328" text-anchor="middle" class="tag">不是 subscribeOn</text>
  <path d="M350 287H400" class="arr"/><path d="M690 287H740" class="arr"/><path d="M1030 287H1080" class="arr"/>
  <rect x="215" y="480" width="500" height="140" rx="18" class="box"/><text x="465" y="525" text-anchor="middle" class="h">同步终点</text><text x="465" y="565" text-anchor="middle" class="b">call() → ChatResponse</text><text x="465" y="599" text-anchor="middle" class="tag">一个返回值</text>
  <rect x="885" y="480" width="500" height="140" rx="18" class="box"/><text x="1135" y="525" text-anchor="middle" class="h">流式终点</text><text x="1135" y="565" text-anchor="middle" class="b">stream() → Flux&lt;ChatResponse&gt;</text><text x="1135" y="599" text-anchor="middle" class="tag">多次信号 + cancel</text>
  <rect x="270" y="675" width="1060" height="50" rx="12" fill="#e2e8f0"/><text x="800" y="707" text-anchor="middle" class="b">终点不调用 streamAdvisorChain.nextStream()；LOWEST_PRECEDENCE 保证模型执行位于链底部</text>
</svg>
