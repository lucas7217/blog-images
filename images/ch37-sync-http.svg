<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.red{fill:#fff1f2;stroke:#fb7185;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">DashScope 同步 HTTP 调用链</text><text x="800" y="94" text-anchor="middle" class="sub">请求校验与 Header 合并 → RestClient POST → Provider 响应 → ChatResponse 转换</text>
<rect x="45" y="190" width="270" height="165" rx="18" class="blue"/><text x="180" y="235" text-anchor="middle" class="h">ChatCompletionRequest</text><text x="180" y="275" text-anchor="middle" class="b">stream = false</text><text x="180" y="313" text-anchor="middle" class="tag">请求体</text>
<rect x="355" y="190" width="280" height="165" rx="18" class="box"/><text x="495" y="235" text-anchor="middle" class="h">Header 合并</text><text x="495" y="275" text-anchor="middle" class="b">附加 Header + 默认认证</text><text x="495" y="313" text-anchor="middle" class="tag">不覆盖已有值</text>
<rect x="675" y="190" width="270" height="165" rx="18" class="green"/><text x="810" y="235" text-anchor="middle" class="h">RestClient POST</text><text x="810" y="275" text-anchor="middle" class="b">retrieve().toEntity()</text><text x="810" y="313" text-anchor="middle" class="tag">同步阻塞边界</text>
<rect x="985" y="190" width="270" height="165" rx="18" class="box"/><text x="1120" y="235" text-anchor="middle" class="h">DashScope Response</text><text x="1120" y="275" text-anchor="middle" class="b">Output · Usage · RequestId</text><text x="1120" y="313" text-anchor="middle" class="tag">Provider 类型</text>
<rect x="1295" y="190" width="260" height="165" rx="18" class="blue"/><text x="1425" y="235" text-anchor="middle" class="h">ChatResponse</text><text x="1425" y="275" text-anchor="middle" class="b">Generation + Metadata</text><text x="1425" y="313" text-anchor="middle" class="tag">Spring AI 类型</text>
<path d="M315 272H345" class="arr"/><path d="M635 272H665" class="arr"/><path d="M945 272H975" class="arr"/><path d="M1255 272H1285" class="arr"/>
<rect x="285" y="490" width="430" height="145" rx="18" class="red"/><text x="500" y="535" text-anchor="middle" class="h">HTTP 非成功响应</text><text x="500" y="575" text-anchor="middle" class="b">ResponseErrorHandler 转换异常</text><text x="500" y="609" text-anchor="middle" class="tag">由 Retry 策略判断是否重试</text>
<rect x="885" y="490" width="430" height="145" rx="18" class="box"/><text x="1100" y="535" text-anchor="middle" class="h">成功响应转换</text><text x="1100" y="575" text-anchor="middle" class="b">Choice → Generation；TokenUsage → Usage</text><text x="1100" y="609" text-anchor="middle" class="tag">FinishReason / SearchInfo / Reasoning</text>
<path d="M810 355V420H500V480" class="arr"/><path d="M1120 355V480" class="arr"/><rect x="250" y="680" width="1100" height="48" rx="12" fill="#e2e8f0"/><text x="800" y="711" text-anchor="middle" class="b">一次业务 call 可能因重试或 Tool Calling 产生多次 HTTP 请求，不能按 1:1 假设计费与日志</text></svg>
