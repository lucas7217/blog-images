<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">nextStream()：流式 Advisor Chain 的惰性执行</text>
  <text x="800" y="94" text-anchor="middle" class="sub">创建 Flux 不等于执行；订阅后才读取 Context、pop Advisor 并发出响应片段</text>
  <rect x="55" y="175" width="280" height="160" rx="18" class="blue"/><text x="195" y="220" text-anchor="middle" class="h">StreamResponseSpec</text><text x="195" y="260" text-anchor="middle" class="b">content() / chatResponse()</text><text x="195" y="298" text-anchor="middle" class="tag">返回 Flux</text>
  <rect x="380" y="175" width="280" height="160" rx="18" class="box"/><text x="520" y="220" text-anchor="middle" class="h">订阅发生</text><text x="520" y="260" text-anchor="middle" class="b">Flux.deferContextual</text><text x="520" y="298" text-anchor="middle" class="tag">开始真正执行</text>
  <rect x="705" y="175" width="280" height="160" rx="18" class="box"/><text x="845" y="220" text-anchor="middle" class="h">pop StreamAdvisor</text><text x="845" y="260" text-anchor="middle" class="b">adviseStream(request, chain)</text><text x="845" y="298" text-anchor="middle" class="tag">递归推进</text>
  <rect x="1030" y="175" width="350" height="160" rx="18" class="green"/><text x="1205" y="220" text-anchor="middle" class="h">ChatModelStreamAdvisor</text><text x="1205" y="260" text-anchor="middle" class="b">ChatModel.stream()</text><text x="1205" y="298" text-anchor="middle" class="tag">Flux&lt;ChatClientResponse&gt;</text>
  <path d="M335 255H370" class="arr"/><path d="M660 255H695" class="arr"/><path d="M985 255H1020" class="arr"/>
  <rect x="210" y="445" width="330" height="150" rx="18" class="box"/><text x="375" y="490" text-anchor="middle" class="h">Reactor Context</text><text x="375" y="530" text-anchor="middle" class="b">传播父 Observation</text><text x="375" y="564" text-anchor="middle" class="tag">contextWrite</text>
  <rect x="635" y="445" width="330" height="150" rx="18" class="box"/><text x="800" y="490" text-anchor="middle" class="h">生命周期信号</text><text x="800" y="530" text-anchor="middle" class="b">error · complete · cancel</text><text x="800" y="564" text-anchor="middle" class="tag">doOnError / doFinally</text>
  <rect x="1060" y="445" width="330" height="150" rx="18" class="blue"/><text x="1225" y="490" text-anchor="middle" class="h">Message Aggregator</text><text x="1225" y="530" text-anchor="middle" class="b">汇总流片段供观测使用</text><text x="1225" y="564" text-anchor="middle" class="tag">不改变业务流语义</text>
  <path d="M1205 335V395H375V435" class="arr"/><path d="M540 520H625" class="arr"/><path d="M965 520H1050" class="arr"/>
  <rect x="260" y="665" width="1080" height="52" rx="12" fill="#e2e8f0"/><text x="800" y="698" text-anchor="middle" class="b">必须消费或订阅 Flux；取消订阅也要停止 Observation，避免把半途取消误记为完整成功</text>
</svg>
