<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:24px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:35px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">STREAMING · SSE</text><text x="700" y="145" class="t h" text-anchor="middle">模型片段如何持续到达浏览器</text><text x="700" y="184" class="t s" text-anchor="middle">流式调用降低首段等待时间，但不会让模型总计算时间自动缩短</text><g transform="translate(80,300)"><rect width="220" height="125" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="110" y="55" class="t b" text-anchor="middle">ChatClient</text><text x="110" y="88" class="t d" text-anchor="middle">stream()</text></g><text x="325" y="375" class="t a">→</text><g transform="translate(380,300)"><rect width="220" height="125" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="110" y="55" class="t b" text-anchor="middle">Flux&lt;String&gt;</text><text x="110" y="88" class="t d" text-anchor="middle">异步文本片段</text></g><text x="625" y="375" class="t a">→</text><g transform="translate(680,300)"><rect width="220" height="125" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="110" y="55" class="t b" text-anchor="middle">SSE</text><text x="110" y="88" class="t d" text-anchor="middle">HTTP 持续推送</text></g><text x="925" y="375" class="t a">→</text><g transform="translate(980,300)"><rect width="330" height="125" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="165" y="50" class="t b" text-anchor="middle">Browser</text><text x="165" y="85" class="t d" text-anchor="middle">片段到达即更新页面</text></g><rect x="160" y="515" width="1080" height="105" rx="16" fill="#f1f5f9"/><text x="700" y="558" class="t b" text-anchor="middle">必须处理断开、取消、错误与背压</text><text x="700" y="594" class="t d" text-anchor="middle">不要在响应式链路中随意 block()，也不要假设每个片段正好等于一个 Token</text><text x="700" y="730" class="t s" text-anchor="middle">第 10 章 · 流式调用 stream()</text></svg>
