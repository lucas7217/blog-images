<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#ffffff"/>
  <style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:25px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:35px;fill:#64748b}</style>
  <text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">PROMPT · MESSAGE</text>
  <text x="700" y="145" class="t h" text-anchor="middle">Prompt 如何组织一次模型输入</text>
  <text x="700" y="184" class="t s" text-anchor="middle">Prompt 是请求载体，Message 表达参与对话的不同角色</text>
  <rect x="90" y="260" width="1220" height="390" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="325" class="t b">Prompt</text><text x="170" y="360" class="t d">Messages + ChatOptions</text>
  <text x="385" y="425" class="t a">→</text>
  <rect x="455" y="280" width="250" height="105" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="580" y="325" class="t b" text-anchor="middle">System Message</text><text x="580" y="357" class="t d" text-anchor="middle">角色、目标与约束</text>
  <rect x="455" y="410" width="250" height="105" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="580" y="455" class="t b" text-anchor="middle">User Message</text><text x="580" y="487" class="t d" text-anchor="middle">用户本次输入</text>
  <rect x="455" y="540" width="250" height="80" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="580" y="588" class="t b" text-anchor="middle">Assistant Message</text>
  <text x="750" y="465" class="t a">+</text>
  <rect x="820" y="365" width="280" height="150" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="960" y="420" class="t b" text-anchor="middle">ChatOptions</text><text x="960" y="458" class="t d" text-anchor="middle">model · temperature</text><text x="960" y="488" class="t d" text-anchor="middle">maxTokens · 其他参数</text>
  <text x="1135" y="455" class="t a">→</text><rect x="1190" y="380" width="90" height="120" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="1235" y="430" class="t b" text-anchor="middle">模型</text><text x="1235" y="466" class="t d" text-anchor="middle">请求</text>
  <text x="700" y="730" class="t s" text-anchor="middle">模板负责复用文本结构，参数在运行时填充；外部输入不能被当成可信系统规则。</text>
</svg>
