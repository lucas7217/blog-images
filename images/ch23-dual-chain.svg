<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:30px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">CALL / STREAM CHAINS</text><text x="700" y="145" class="t h" text-anchor="middle">同一请求，两种执行语义</text><text x="700" y="184" class="t s" text-anchor="middle">同步链返回单个响应，流式链返回 Publisher 并持续传播数据与信号</text><text x="130" y="275" class="t b">Call Chain</text><g transform="translate(120,310)"><rect width="220" height="105" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="110" y="45" class="t b" text-anchor="middle">CallAdvisor</text><text x="110" y="76" class="t d" text-anchor="middle">adviseCall()</text></g><text x="365" y="375" class="t a">→</text><g transform="translate(420,310)"><rect width="220" height="105" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="110" y="45" class="t b" text-anchor="middle">nextCall()</text><text x="110" y="76" class="t d" text-anchor="middle">单个响应</text></g><text x="665" y="375" class="t a">→</text><g transform="translate(720,310)"><rect width="250" height="105" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="125" y="45" class="t b" text-anchor="middle">ChatModel.call</text></g><text x="995" y="375" class="t a">→</text><g transform="translate(1050,310)"><rect width="230" height="105" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="115" y="45" class="t b" text-anchor="middle">ChatResponse</text></g><text x="130" y="505" class="t b">Stream Chain</text><g transform="translate(120,540)"><rect width="220" height="105" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="110" y="45" class="t b" text-anchor="middle">StreamAdvisor</text><text x="110" y="76" class="t d" text-anchor="middle">adviseStream()</text></g><text x="365" y="605" class="t a">→</text><g transform="translate(420,540)"><rect width="220" height="105" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="110" y="45" class="t b" text-anchor="middle">nextStream()</text><text x="110" y="76" class="t d" text-anchor="middle">Publisher 信号</text></g><text x="665" y="605" class="t a">→</text><g transform="translate(720,540)"><rect width="250" height="105" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="125" y="45" class="t b" text-anchor="middle">ChatModel.stream</text></g><text x="995" y="605" class="t a">→</text><g transform="translate(1050,540)"><rect width="230" height="105" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="115" y="45" class="t b" text-anchor="middle">Flux&lt;ChatResponse&gt;</text></g><text x="700" y="745" class="t s" text-anchor="middle">第 23 章 · Call / Stream 双责任链</text></svg>
