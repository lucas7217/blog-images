<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:32px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">TOOL CALLING</text><text x="700" y="145" class="t h" text-anchor="middle">模型选择工具，应用负责执行</text><text x="700" y="184" class="t s" text-anchor="middle">工具定义和参数结构发给模型，Java 方法始终运行在应用侧</text><g transform="translate(65,300)"><rect width="210" height="125" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">用户问题</text><text x="105" y="82" class="t d" text-anchor="middle">查询订单状态</text></g><text x="295" y="375" class="t a">→</text><g transform="translate(345,300)"><rect width="210" height="125" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">模型判断</text><text x="105" y="82" class="t d" text-anchor="middle">选择工具与参数</text></g><text x="575" y="375" class="t a">→</text><g transform="translate(625,300)"><rect width="220" height="125" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="110" y="48" class="t b" text-anchor="middle">应用执行工具</text><text x="110" y="82" class="t d" text-anchor="middle">Java / API / Database</text></g><text x="865" y="375" class="t a">→</text><g transform="translate(915,300)"><rect width="210" height="125" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">工具结果</text><text x="105" y="82" class="t d" text-anchor="middle">回传模型</text></g><text x="1145" y="375" class="t a">→</text><g transform="translate(1195,300)"><rect width="140" height="125" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="70" y="48" class="t b" text-anchor="middle">回答</text><text x="70" y="82" class="t d" text-anchor="middle">组织结果</text></g><rect x="160" y="515" width="1080" height="110" rx="16" fill="#f1f5f9"/><text x="700" y="558" class="t b" text-anchor="middle">模型提出调用请求，不拥有业务权限</text><text x="700" y="594" class="t d" text-anchor="middle">应用必须校验身份、参数、幂等性和风险等级，写操作默认需要更严格控制</text><text x="700" y="730" class="t s" text-anchor="middle">第 17 章 · Tool Calling</text></svg>
