<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:32px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">CHATCLIENT DESIGN</text><text x="700" y="145" class="t h" text-anchor="middle">ChatClient 为什么存在</text><text x="700" y="184" class="t s" text-anchor="middle">把易变的请求组织与响应提取留在应用层，把模型执行委托给 ChatModel</text><g transform="translate(70,285)"><rect width="240" height="160" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="120" y="48" class="t b" text-anchor="middle">业务 Service</text><text x="120" y="84" class="t d" text-anchor="middle">业务意图</text><text x="120" y="112" class="t d" text-anchor="middle">输入与返回类型</text></g><text x="335" y="380" class="t a">→</text><g transform="translate(390,250)"><rect width="370" height="230" rx="20" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="185" y="45" class="t b" text-anchor="middle">ChatClient</text><rect x="30" y="75" width="140" height="105" rx="13" fill="#fff"/><text x="100" y="115" class="t b" text-anchor="middle">RequestSpec</text><text x="100" y="148" class="t d" text-anchor="middle">Messages / Options</text><rect x="200" y="75" width="140" height="105" rx="13" fill="#fff"/><text x="270" y="115" class="t b" text-anchor="middle">ResponseSpec</text><text x="270" y="148" class="t d" text-anchor="middle">内容 / 实体</text><text x="185" y="213" class="t d" text-anchor="middle">Advisor · Tool · Observation</text></g><text x="785" y="380" class="t a">→</text><g transform="translate(840,285)"><rect width="240" height="160" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="120" y="48" class="t b" text-anchor="middle">ChatModel</text><text x="120" y="84" class="t d" text-anchor="middle">call / stream</text><text x="120" y="112" class="t d" text-anchor="middle">统一模型抽象</text></g><text x="1105" y="380" class="t a">→</text><g transform="translate(1160,285)"><rect width="180" height="160" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="90" y="48" class="t b" text-anchor="middle">Provider</text><text x="90" y="84" class="t d" text-anchor="middle">DashScope</text><text x="90" y="112" class="t d" text-anchor="middle">OpenAI 等</text></g><rect x="170" y="535" width="1060" height="100" rx="16" fill="#f1f5f9"/><text x="700" y="575" class="t b" text-anchor="middle">ChatClient 是编排边界，不是另一个模型</text><text x="700" y="610" class="t d" text-anchor="middle">它让业务代码表达“这次请求需要什么”，而不是手工组装每一个底层对象</text><text x="700" y="730" class="t s" text-anchor="middle">第 20 章 · ChatClient 为什么存在</text></svg>
