<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="1600" height="780" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">企业知识库 RAG：入库链与查询链</text><text x="800" y="94" text-anchor="middle" class="sub">文档离线加工形成可检索知识，在线查询必须携带租户过滤并返回引用</text>
<text x="90" y="150" class="tag">离线入库链</text><rect x="80" y="175" width="220" height="130" rx="16" class="blue"/><text x="190" y="215" text-anchor="middle" class="h">文档上传</text><text x="190" y="252" text-anchor="middle" class="b">鉴权 · 病毒扫描 · 去重</text><rect x="350" y="175" width="220" height="130" rx="16" class="box"/><text x="460" y="215" text-anchor="middle" class="h">解析与清洗</text><text x="460" y="252" text-anchor="middle" class="b">正文 · 标题 · Metadata</text><rect x="620" y="175" width="220" height="130" rx="16" class="box"/><text x="730" y="215" text-anchor="middle" class="h">Chunking</text><text x="730" y="252" text-anchor="middle" class="b">语义边界 · 重叠窗口</text><rect x="890" y="175" width="220" height="130" rx="16" class="box"/><text x="1000" y="215" text-anchor="middle" class="h">Embedding</text><text x="1000" y="252" text-anchor="middle" class="b">批量向量化</text><rect x="1160" y="175" width="330" height="130" rx="16" class="green"/><text x="1325" y="215" text-anchor="middle" class="h">VectorStore</text><text x="1325" y="252" text-anchor="middle" class="b">向量 + tenantId + sourceId</text><path d="M300 240H340" class="arr"/><path d="M570 240H610" class="arr"/><path d="M840 240H880" class="arr"/><path d="M1110 240H1150" class="arr"/>
<text x="90" y="400" class="tag">在线查询链</text><rect x="80" y="425" width="240" height="140" rx="16" class="blue"/><text x="200" y="468" text-anchor="middle" class="h">用户问题</text><text x="200" y="508" text-anchor="middle" class="b">tenantId · userId</text><text x="200" y="540" text-anchor="middle" class="tag">权限上下文</text><rect x="390" y="425" width="280" height="140" rx="16" class="box"/><text x="530" y="468" text-anchor="middle" class="h">Retrieval</text><text x="530" y="508" text-anchor="middle" class="b">向量检索 + Metadata Filter</text><text x="530" y="540" text-anchor="middle" class="tag">TopK / Threshold</text><rect x="740" y="425" width="280" height="140" rx="16" class="box"/><text x="880" y="468" text-anchor="middle" class="h">Prompt 增强</text><text x="880" y="508" text-anchor="middle" class="b">问题 + 证据片段</text><text x="880" y="540" text-anchor="middle" class="tag">拒答边界</text><rect x="1090" y="425" width="400" height="140" rx="16" class="green"/><text x="1290" y="468" text-anchor="middle" class="h">答案 + Citation</text><text x="1290" y="508" text-anchor="middle" class="b">sourceId · page · chunkId</text><text x="1290" y="540" text-anchor="middle" class="tag">可验证输出</text><path d="M320 495H380" class="arr"/><path d="M670 495H730" class="arr"/><path d="M1020 495H1080" class="arr"/>
<rect x="245" y="660" width="1110" height="68" rx="14" fill="#e2e8f0"/><text x="800" y="701" text-anchor="middle" class="b">隔离原则：tenantId 必须由认证上下文产生，并同时约束上传、存储、检索与引用，不接受模型或用户文本自行声明</text></svg>
