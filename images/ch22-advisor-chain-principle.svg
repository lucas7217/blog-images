<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:21px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:30px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">RESPONSIBILITY CHAIN</text><text x="700" y="145" class="t h" text-anchor="middle">Advisor：请求向下，响应向上</text><text x="700" y="184" class="t s" text-anchor="middle">每个节点都能在 nextCall() 前后执行逻辑，形成 Around Advice</text><g transform="translate(70,285)"><rect width="190" height="120" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="95" y="50" class="t b" text-anchor="middle">Logging</text><text x="95" y="82" class="t d" text-anchor="middle">order = 10</text></g><text x="280" y="355" class="t a">→</text><g transform="translate(325,285)"><rect width="190" height="120" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="95" y="50" class="t b" text-anchor="middle">Memory</text><text x="95" y="82" class="t d" text-anchor="middle">order = 20</text></g><text x="535" y="355" class="t a">→</text><g transform="translate(580,285)"><rect width="190" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="95" y="50" class="t b" text-anchor="middle">RAG</text><text x="95" y="82" class="t d" text-anchor="middle">order = 30</text></g><text x="790" y="355" class="t a">→</text><g transform="translate(835,285)"><rect width="230" height="120" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="115" y="48" class="t b" text-anchor="middle">Model Advisor</text><text x="115" y="80" class="t d" text-anchor="middle">ChatModel.call()</text></g><text x="1085" y="355" class="t a">→</text><g transform="translate(1130,285)"><rect width="200" height="120" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="100" y="50" class="t b" text-anchor="middle">ChatResponse</text></g><path d="M1230 440 C1120 565 365 565 165 440" fill="none" stroke="#64748b" stroke-width="3"/><text x="700" y="525" class="t b" text-anchor="middle">响应反向经过：RAG → Memory → Logging</text><rect x="190" y="600" width="1020" height="70" rx="14" fill="#f1f5f9"/><text x="700" y="643" class="t d" text-anchor="middle">忘记调用 nextCall() 会截断链；重复调用可能造成多次模型请求或副作用</text><text x="700" y="745" class="t s" text-anchor="middle">第 22 章 · Advisor 责任链原理</text></svg>
