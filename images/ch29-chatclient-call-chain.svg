<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">prompt().user().call().content() 调用链</text>
  <text x="800" y="94" text-anchor="middle" class="sub">前三步主要构建请求，content() 才触发同步执行并提取文本</text>
  <rect x="65" y="180" width="270" height="160" rx="18" class="blue"/><text x="200" y="225" text-anchor="middle" class="h">prompt()</text><text x="200" y="265" text-anchor="middle" class="b">复制默认 RequestSpec</text><text x="200" y="301" text-anchor="middle" class="tag">尚未调用模型</text>
  <rect x="385" y="180" width="270" height="160" rx="18" class="blue"/><text x="520" y="225" text-anchor="middle" class="h">user(text)</text><text x="520" y="265" text-anchor="middle" class="b">写入 userText</text><text x="520" y="301" text-anchor="middle" class="tag">返回同一 RequestSpec</text>
  <rect x="705" y="180" width="270" height="160" rx="18" class="blue"/><text x="840" y="225" text-anchor="middle" class="h">call()</text><text x="840" y="265" text-anchor="middle" class="b">构建 AdvisorChain</text><text x="840" y="301" text-anchor="middle" class="tag">返回 CallResponseSpec</text>
  <rect x="1025" y="180" width="270" height="160" rx="18" class="green"/><text x="1160" y="225" text-anchor="middle" class="h">content()</text><text x="1160" y="265" text-anchor="middle" class="b">触发 nextCall()</text><text x="1160" y="301" text-anchor="middle" class="tag">执行发生在这里</text>
  <path d="M335 260H375" class="arr"/><path d="M655 260H695" class="arr"/><path d="M975 260H1015" class="arr"/>
  <rect x="985" y="455" width="350" height="165" rx="18" class="box"/><text x="1160" y="500" text-anchor="middle" class="h">ChatModelCallAdvisor</text><text x="1160" y="540" text-anchor="middle" class="b">终止 Advisor 链</text><text x="1160" y="576" text-anchor="middle" class="tag">调用 ChatModel</text>
  <rect x="545" y="455" width="350" height="165" rx="18" class="box"/><text x="720" y="500" text-anchor="middle" class="h">ChatClientResponse</text><text x="720" y="540" text-anchor="middle" class="b">包装 ChatResponse</text><text x="720" y="576" text-anchor="middle" class="tag">记录 Observation</text>
  <rect x="105" y="455" width="350" height="165" rx="18" class="green"/><text x="280" y="500" text-anchor="middle" class="h">String content</text><text x="280" y="540" text-anchor="middle" class="b">Generation → Output → Text</text><text x="280" y="576" text-anchor="middle" class="tag">最终返回值</text>
  <path d="M1160 340V445" class="arr"/><path d="M985 538H905" class="arr"/><path d="M545 538H465" class="arr"/>
  <rect x="245" y="670" width="1110" height="52" rx="12" fill="#e2e8f0"/><text x="800" y="703" text-anchor="middle" class="b">链式 API 把“请求描述”与“实际执行”分离：便于在执行前统一加入 Prompt、Options、Advisor 与 Tool</text>
</svg>
