<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="1600" height="800" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">AI 应用可观测性：从请求到 Provider 的完整链路</text><text x="800" y="94" text-anchor="middle" class="sub">ObservationRegistry 统一生成指标与追踪，结构化日志通过 traceId 与业务上下文关联</text>
<rect x="50" y="185" width="230" height="150" rx="18" class="blue"/><text x="165" y="230" text-anchor="middle" class="h">HTTP Request</text><text x="165" y="270" text-anchor="middle" class="b">tenant · scene</text><text x="165" y="305" text-anchor="middle" class="tag">traceId</text><rect x="325" y="185" width="230" height="150" rx="18" class="box"/><text x="440" y="230" text-anchor="middle" class="h">ChatClient</text><text x="440" y="270" text-anchor="middle" class="b">一次应用调用</text><text x="440" y="305" text-anchor="middle" class="tag">client span</text><rect x="600" y="185" width="230" height="150" rx="18" class="box"/><text x="715" y="230" text-anchor="middle" class="h">Advisor Chain</text><text x="715" y="270" text-anchor="middle" class="b">Memory · RAG</text><text x="715" y="305" text-anchor="middle" class="tag">advisor spans</text><rect x="875" y="185" width="230" height="150" rx="18" class="box"/><text x="990" y="230" text-anchor="middle" class="h">ChatModel</text><text x="990" y="270" text-anchor="middle" class="b">model · usage</text><text x="990" y="305" text-anchor="middle" class="tag">model span</text><rect x="1150" y="185" width="230" height="150" rx="18" class="green"/><text x="1265" y="230" text-anchor="middle" class="h">Provider / Tool</text><text x="1265" y="270" text-anchor="middle" class="b">requestId · status</text><text x="1265" y="305" text-anchor="middle" class="tag">external span</text><path d="M280 260H315" class="arr"/><path d="M555 260H590" class="arr"/><path d="M830 260H865" class="arr"/><path d="M1105 260H1140" class="arr"/>
<rect x="210" y="460" width="330" height="165" rx="18" class="blue"/><text x="375" y="505" text-anchor="middle" class="h">Metrics</text><text x="375" y="545" text-anchor="middle" class="b">latency · error · token · cost</text><text x="375" y="582" text-anchor="middle" class="tag">低基数聚合</text><rect x="635" y="460" width="330" height="165" rx="18" class="orange"/><text x="800" y="505" text-anchor="middle" class="h">Tracing</text><text x="800" y="545" text-anchor="middle" class="b">父子 Span 与关键事件</text><text x="800" y="582" text-anchor="middle" class="tag">跨服务传播</text><rect x="1060" y="460" width="330" height="165" rx="18" class="blue"/><text x="1225" y="505" text-anchor="middle" class="h">Structured Logging</text><text x="1225" y="545" text-anchor="middle" class="b">traceId · decision · error</text><text x="1225" y="582" text-anchor="middle" class="tag">正文默认不记录</text><path d="M440 335V405H375V450" class="arr"/><path d="M715 335V450" class="arr"/><path d="M990 335V405H1225V450" class="arr"/>
<rect x="270" y="700" width="1060" height="50" rx="12" fill="#e2e8f0"/><text x="800" y="732" text-anchor="middle" class="b">指标标签保持低基数；Prompt、响应和 Tool 参数默认脱敏或不采集，不能用可观测性制造数据泄露</text></svg>
