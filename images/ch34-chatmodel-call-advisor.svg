<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">ChatModelCallAdvisor：同步责任链的模型终点</text>
  <text x="800" y="94" text-anchor="middle" class="sub">格式指令增强 → Prompt 提取 → ChatModel 调用 → 响应与 Context 封装</text>
  <rect x="55" y="210" width="270" height="165" rx="18" class="blue"/><text x="190" y="255" text-anchor="middle" class="h">ChatClientRequest</text><text x="190" y="295" text-anchor="middle" class="b">Prompt + Context</text><text x="190" y="333" text-anchor="middle" class="tag">adviseCall()</text>
  <rect x="370" y="210" width="300" height="165" rx="18" class="box"/><text x="520" y="255" text-anchor="middle" class="h">格式指令处理</text><text x="520" y="295" text-anchor="middle" class="b">Native Schema 或 Prompt 增强</text><text x="520" y="333" text-anchor="middle" class="tag">augmentWithFormatInstructions</text>
  <rect x="715" y="210" width="250" height="165" rx="18" class="box"/><text x="840" y="255" text-anchor="middle" class="h">Prompt</text><text x="840" y="295" text-anchor="middle" class="b">request.prompt()</text><text x="840" y="333" text-anchor="middle" class="tag">模型标准输入</text>
  <rect x="1010" y="210" width="260" height="165" rx="18" class="green"/><text x="1140" y="255" text-anchor="middle" class="h">ChatModel.call()</text><text x="1140" y="295" text-anchor="middle" class="b">同步模型执行</text><text x="1140" y="333" text-anchor="middle" class="tag">ChatResponse</text>
  <rect x="1315" y="210" width="240" height="165" rx="18" class="blue"/><text x="1435" y="255" text-anchor="middle" class="h">ChatClientResponse</text><text x="1435" y="295" text-anchor="middle" class="b">Response + Context</text><text x="1435" y="333" text-anchor="middle" class="tag">向上游返回</text>
  <path d="M325 292H360" class="arr"/><path d="M670 292H705" class="arr"/><path d="M965 292H1000" class="arr"/><path d="M1270 292H1305" class="arr"/>
  <rect x="245" y="500" width="500" height="130" rx="16" class="box"/><text x="495" y="545" text-anchor="middle" class="h">普通结构化输出</text><text x="495" y="584" text-anchor="middle" class="b">Format Instructions 追加到 User Message</text>
  <rect x="855" y="500" width="500" height="130" rx="16" class="box"/><text x="1105" y="545" text-anchor="middle" class="h">原生结构化输出</text><text x="1105" y="584" text-anchor="middle" class="b">JSON Schema 写入 StructuredOutputChatOptions</text>
  <rect x="290" y="675" width="1020" height="50" rx="12" fill="#e2e8f0"/><text x="800" y="707" text-anchor="middle" class="b">getOrder() = LOWEST_PRECEDENCE，且 adviseCall() 不再 nextCall()：它就是同步链终点</text>
</svg>
