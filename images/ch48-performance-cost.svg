<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810"><rect width="1600" height="810" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">性能与成本优化闭环</text><text x="800" y="94" text-anchor="middle" class="sub">先测量质量、延迟和成本，再从上下文、检索、模型、缓存与并发逐层优化</text>
<rect x="50" y="200" width="235" height="155" rx="18" class="blue"/><text x="168" y="245" text-anchor="middle" class="h">Measure</text><text x="168" y="285" text-anchor="middle" class="b">quality · latency · cost</text><text x="168" y="321" text-anchor="middle" class="tag">建立基线</text><rect x="325" y="200" width="235" height="155" rx="18" class="box"/><text x="443" y="245" text-anchor="middle" class="h">Reduce Context</text><text x="443" y="285" text-anchor="middle" class="b">Prompt · Memory · RAG</text><text x="443" y="321" text-anchor="middle" class="tag">减少无效 Token</text><rect x="600" y="200" width="235" height="155" rx="18" class="box"/><text x="718" y="245" text-anchor="middle" class="h">Route Model</text><text x="718" y="285" text-anchor="middle" class="b">能力与价格匹配</text><text x="718" y="321" text-anchor="middle" class="tag">质量底线</text><rect x="875" y="200" width="235" height="155" rx="18" class="green"/><text x="993" y="245" text-anchor="middle" class="h">Cache</text><text x="993" y="285" text-anchor="middle" class="b">Embedding · Retrieval · Answer</text><text x="993" y="321" text-anchor="middle" class="tag">权限与版本 Key</text><rect x="1150" y="200" width="235" height="155" rx="18" class="box"/><text x="1268" y="245" text-anchor="middle" class="h">Concurrency</text><text x="1268" y="285" text-anchor="middle" class="b">pool · queue · backpressure</text><text x="1268" y="321" text-anchor="middle" class="tag">资源隔离</text><path d="M285 277H315" class="arr"/><path d="M560 277H590" class="arr"/><path d="M835 277H865" class="arr"/><path d="M1110 277H1140" class="arr"/>
<rect x="175" y="475" width="350" height="155" rx="18" class="orange"/><text x="350" y="520" text-anchor="middle" class="h">Token Cost</text><text x="350" y="560" text-anchor="middle" class="b">input + output + extra rounds</text><text x="350" y="595" text-anchor="middle" class="tag">按场景与租户统计</text><rect x="625" y="475" width="350" height="155" rx="18" class="orange"/><text x="800" y="520" text-anchor="middle" class="h">Latency</text><text x="800" y="560" text-anchor="middle" class="b">queue + retrieval + first token + generation</text><text x="800" y="595" text-anchor="middle" class="tag">分层 P95</text><rect x="1075" y="475" width="350" height="155" rx="18" class="orange"/><text x="1250" y="520" text-anchor="middle" class="h">Quality</text><text x="1250" y="560" text-anchor="middle" class="b">task score + citation + failure</text><text x="1250" y="595" text-anchor="middle" class="tag">不可牺牲的门槛</text>
<rect x="245" y="705" width="1110" height="55" rx="12" fill="#e2e8f0"/><text x="800" y="739" text-anchor="middle" class="b">Streaming 改善感知延迟，不必然减少总时长和 Token；任何成本优化都必须通过质量评测回归</text></svg>
