<rect x="1010" y="325" width="275" height="140" rx="18" class="orange"/><text x="1148" y="370" text-anchor="middle" class="h">Handoff Policy</text><text x="1148" y="410" text-anchor="middle" class="b">风险 · 情绪 · 置信度</text><text x="1148" y="440" text-anchor="middle" class="tag">确定性规则</text>
