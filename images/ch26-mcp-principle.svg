a">→</text><g transform="translate(1100,300)"><rect width="255" height="140" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="128" y="45" class="t b" text-anchor="middle">MCP Server 执行</text><text x="128" y="78" class="t d" text-anchor="middle">result → model</text></g><rect x="165" y="525" width="1070" height="105" rx="16" fill="#f1f5f9"/><text x="700" y="565" class="t b" text-anchor="middle">协议互通不等于信任互通</text><text x="700" y="600" class="t d" text-anchor="middle">企业接入还需要目录治理、命名空间、身份传递、审批、审计和版本兼容</text><text x="700" y="730" class="t s" text-anchor="middle">第 26 章 · MCP 工作原理</text></svg>
