<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:32px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">RETRIEVAL-AUGMENTED GENERATION</text><text x="700" y="145" class="t h" text-anchor="middle">RAG 的离线入库与在线问答</text><text x="700" y="184" class="t s" text-anchor="middle">先把外部知识检索出来，再作为证据增强本次 Prompt</text><text x="160" y="255" class="t b">离线知识准备</text><g transform="translate(70,290)"><rect width="210" height="110" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">文档加载</text><text x="105" y="78" class="t d" text-anchor="middle">PDF / Markdown</text></g><text x="295" y="355" class="t a">→</text><g transform="translate(345,290)"><rect width="210" height="110" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">切分与清洗</text><text x="105" y="78" class="t d" text-anchor="middle">Chunk + Metadata</text></g><text x="570" y="355" class="t a">→</text><g transform="translate(620,290)"><rect width="210" height="110" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">Embedding</text><text x="105" y="78" class="t d" text-anchor="middle">生成向量</text></g><text x="845" y="355" class="t a">→</text><g transform="translate(895,290)"><rect width="220" height="110" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="110" y="48" class="t b" text-anchor="middle">VectorStore</text><text x="110" y="78" class="t d" text-anchor="middle">索引知识</text></g><text x="160" y="495" class="t b">在线问答</text><g transform="translate(70,530)"><rect width="210" height="110" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">用户问题</text></g><text x="295" y="595" class="t a">→</text><g transform="translate(345,530)"><rect width="210" height="110" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="105" y="48" class="t b" text-anchor="middle">检索证据</text><text x="105" y="78" class="t d" text-anchor="middle">TopK + Filter</text></g><text x="570" y="595" class="t a">→</text><g transform="translate(620,530)"><rect width="230" height="110" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="115" y="48" class="t b" text-anchor="middle">Prompt 增强</text><text x="115" y="78" class="t d" text-anchor="middle">问题 + 上下文</text></g><text x="865" y="595" class="t a">→</text><g transform="translate(915,530)"><rect width="220" height="110" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="110" y="48" class="t b" text-anchor="middle">模型回答</text><text x="110" y="78" class="t d" text-anchor="middle">答案 + 引用</text></g><rect x="1170" y="280" width="170" height="360" rx="20" fill="#f1f5f9"/><text x="1255" y="380" class="t b" text-anchor="middle">质量评估</text><text x="1255" y="430" class="t d" text-anchor="middle">检索命中</text><text x="1255" y="465" class="t d" text-anchor="middle">忠实度</text><text x="1255" y="500" class="t d" text-anchor="middle">引用准确</text><text x="1255" y="535" class="t d" text-anchor="middle">权限隔离</text><text x="700" y="730" class="t s" text-anchor="middle">第 16 章 · RAG</text></svg>
