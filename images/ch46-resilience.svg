<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="1600" height="800" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.red{fill:#fff1f2;stroke:#fb7185;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">AI 应用稳定性防线</text><text x="800" y="94" text-anchor="middle" class="sub">先限制进入量，再限制等待时间；谨慎重试，快速熔断，最后才做能力兼容的降级</text>
<rect x="45" y="200" width="230" height="155" rx="18" class="blue"/><text x="160" y="245" text-anchor="middle" class="h">Rate Limit</text><text x="160" y="285" text-anchor="middle" class="b">租户 · 用户 · 模型</text><text x="160" y="321" text-anchor="middle" class="tag">控制进入量</text><rect x="315" y="200" width="230" height="155" rx="18" class="orange"/><text x="430" y="245" text-anchor="middle" class="h">Bulkhead</text><text x="430" y="285" text-anchor="middle" class="b">并发与队列隔离</text><text x="430" y="321" text-anchor="middle" class="tag">保护资源池</text><rect x="585" y="200" width="230" height="155" rx="18" class="orange"/><text x="700" y="245" text-anchor="middle" class="h">Timeout</text><text x="700" y="285" text-anchor="middle" class="b">连接 · 首片段 · 总时长</text><text x="700" y="321" text-anchor="middle" class="tag">限制等待</text><rect x="855" y="200" width="230" height="155" rx="18" class="box"/><text x="970" y="245" text-anchor="middle" class="h">Retry</text><text x="970" y="285" text-anchor="middle" class="b">可重放临时错误</text><text x="970" y="321" text-anchor="middle" class="tag">退避 + 抖动</text><rect x="1125" y="200" width="230" height="155" rx="18" class="red"/><text x="1240" y="245" text-anchor="middle" class="h">Circuit Breaker</text><text x="1240" y="285" text-anchor="middle" class="b">快速失败与半开探测</text><text x="1240" y="321" text-anchor="middle" class="tag">隔离故障</text><rect x="1395" y="200" width="165" height="155" rx="18" class="green"/><text x="1478" y="245" text-anchor="middle" class="h">Fallback</text><text x="1478" y="285" text-anchor="middle" class="b">受控降级</text><text x="1478" y="321" text-anchor="middle" class="tag">最后手段</text><path d="M275 277H305" class="arr"/><path d="M545 277H575" class="arr"/><path d="M815 277H845" class="arr"/><path d="M1085 277H1115" class="arr"/><path d="M1355 277H1385" class="arr"/>
<rect x="150" y="470" width="360" height="150" rx="18" class="box"/><text x="330" y="515" text-anchor="middle" class="h">同步调用</text><text x="330" y="555" text-anchor="middle" class="b">响应前失败可按策略重试</text><text x="330" y="590" text-anchor="middle" class="tag">幂等优先</text><rect x="620" y="470" width="360" height="150" rx="18" class="box"/><text x="800" y="515" text-anchor="middle" class="h">流式调用</text><text x="800" y="555" text-anchor="middle" class="b">首片段前与输出后分别处理</text><text x="800" y="590" text-anchor="middle" class="tag">cancel / partial</text><rect x="1090" y="470" width="360" height="150" rx="18" class="box"/><text x="1270" y="515" text-anchor="middle" class="h">Tool / Agent</text><text x="1270" y="555" text-anchor="middle" class="b">副作用状态决定能否重放</text><text x="1270" y="590" text-anchor="middle" class="tag">幂等键 + 状态机</text>
<rect x="255" y="700" width="1090" height="50" rx="12" fill="#e2e8f0"/><text x="800" y="732" text-anchor="middle" class="b">稳定性目标不是“永不失败”，而是限制故障范围、快速恢复并向用户返回真实可解释的状态</text></svg>
