<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790"><rect width="1600" height="790" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">Tool Calling 业务系统：模型决策与服务端执行分离</text><text x="800" y="94" text-anchor="middle" class="sub">模型只选择工具和参数；鉴权、校验、访问数据与副作用控制全部留在应用内部</text>
<rect x="55" y="215" width="240" height="155" rx="18" class="blue"/><text x="175" y="260" text-anchor="middle" class="h">用户请求</text><text x="175" y="300" text-anchor="middle" class="b">自然语言问题</text><text x="175" y="336" text-anchor="middle" class="tag">可信身份在服务端</text>
<rect x="345" y="215" width="250" height="155" rx="18" class="box"/><text x="470" y="260" text-anchor="middle" class="h">LLM</text><text x="470" y="300" text-anchor="middle" class="b">选择 Tool + 生成参数</text><text x="470" y="336" text-anchor="middle" class="tag">不直接访问系统</text>
<rect x="645" y="215" width="300" height="155" rx="18" class="orange"/><text x="795" y="260" text-anchor="middle" class="h">Tool Gateway</text><text x="795" y="300" text-anchor="middle" class="b">Schema · Auth · Validate · Audit</text><text x="795" y="336" text-anchor="middle" class="tag">统一策略层</text>
<rect x="1000" y="115" width="250" height="130" rx="16" class="green"/><text x="1125" y="158" text-anchor="middle" class="h">订单 / 库存</text><text x="1125" y="198" text-anchor="middle" class="b">内部领域 Service</text><rect x="1000" y="290" width="250" height="130" rx="16" class="green"/><text x="1125" y="333" text-anchor="middle" class="h">CRM / 数据库</text><text x="1125" y="373" text-anchor="middle" class="b">受控查询接口</text><rect x="1000" y="465" width="250" height="130" rx="16" class="green"/><text x="1125" y="508" text-anchor="middle" class="h">第三方 API</text><text x="1125" y="548" text-anchor="middle" class="b">超时 · 熔断 · 限流</text>
<rect x="1310" y="215" width="245" height="155" rx="18" class="blue"/><text x="1433" y="260" text-anchor="middle" class="h">Tool Result</text><text x="1433" y="300" text-anchor="middle" class="b">结构化最小结果</text><text x="1433" y="336" text-anchor="middle" class="tag">返回模型组织答案</text>
<path d="M295 292H335" class="arr"/><path d="M595 292H635" class="arr"/><path d="M945 292H975V180H990" class="arr"/><path d="M945 292H990" class="arr"/><path d="M945 292H975V530H990" class="arr"/><path d="M1250 180H1280V250H1300" class="arr"/><path d="M1250 355H1300" class="arr"/><path d="M1250 530H1280V335H1300" class="arr"/>
<rect x="250" y="650" width="1100" height="85" rx="16" fill="#e2e8f0"/><text x="800" y="685" text-anchor="middle" class="h">安全不变量</text><text x="800" y="718" text-anchor="middle" class="b">身份不由模型提供 · 参数重新校验 · 写操作幂等与确认 · 返回最小数据 · 全链路审计</text></svg>
