<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:21px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:29px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">TOOL CALLING INTERNAL LOOP</text><text x="700" y="145" class="t h" text-anchor="middle">一次工具调用为什么需要两次模型交互</text><text x="700" y="184" class="t s" text-anchor="middle">第一次产生 Tool Call，应用执行后，第二次让模型基于 Tool Result 组织最终回答</text><g transform="translate(40,320)"><rect width="190" height="120" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="95" y="45" class="t b" text-anchor="middle">用户问题</text><text x="95" y="78" class="t d" text-anchor="middle">Messages + Tools</text></g><text x="245" y="390" class="t a">→</text><g transform="translate(285,320)"><rect width="190" height="120" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="95" y="45" class="t b" text-anchor="middle">模型 #1</text><text x="95" y="78" class="t d" text-anchor="middle">产生 Tool Call</text></g><text x="490" y="390" class="t a">→</text><g transform="translate(530,320)"><rect width="200" height="120" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="100" y="45" class="t b" text-anchor="middle">应用执行</text><text x="100" y="78" class="t d" text-anchor="middle">Java Tool</text></g><text x="745" y="390" class="t a">→</text><g transform="translate(785,320)"><rect width="200" height="120" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="100" y="45" class="t b" text-anchor="middle">Tool Result</text><text x="100" y="78" class="t d" text-anchor="middle">加入对话历史</text></g><text x="1000" y="390" class="t a">→</text><g transform="translate(1040,320)"><rect width="170" height="120" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="85" y="45" class="t b" text-anchor="middle">模型 #2</text><text x="85" y="78" class="t d" text-anchor="middle">组织回答</text></g><text x="1225" y="390" class="t a">→</text><g transform="translate(1260,320)"><rect width="105" height="120" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="52" y="58" class="t b" text-anchor="middle">最终</text><text x="52" y="88" class="t d" text-anchor="middle">响应</text></g><path d="M875 455 C875 555 610 570 610 455" fill="none" stroke="#64748b" stroke-width="3"/><text x="740" y="595" class="t d" text-anchor="middle">若结果要求继续调用工具，循环再次执行；必须设置次数、超时与预算上限</text><text x="700" y="730" class="t s" text-anchor="middle">第 25 章 · Tool Calling 工作原理</text></svg>
