<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:24px;font-weight:700}.d{font-size:17px;fill:#64748b}.a{font-size:35px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">STRUCTURED OUTPUT</text><text x="700" y="145" class="t h" text-anchor="middle">从模型文本到可用业务对象</text><text x="700" y="184" class="t s" text-anchor="middle">结构约束提高可解析性，程序校验决定结果能否进入业务流程</text><g transform="translate(70,300)"><rect width="230" height="125" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="115" y="53" class="t b" text-anchor="middle">业务 DTO</text><text x="115" y="86" class="t d" text-anchor="middle">字段与类型</text></g><text x="325" y="375" class="t a">→</text><g transform="translate(380,300)"><rect width="260" height="125" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="130" y="53" class="t b" text-anchor="middle">Schema / 指令</text><text x="130" y="86" class="t d" text-anchor="middle">约束模型输出结构</text></g><text x="665" y="375" class="t a">→</text><g transform="translate(720,300)"><rect width="230" height="125" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="115" y="53" class="t b" text-anchor="middle">模型输出</text><text x="115" y="86" class="t d" text-anchor="middle">JSON 文本</text></g><text x="975" y="375" class="t a">→</text><g transform="translate(1030,300)"><rect width="300" height="125" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="150" y="48" class="t b" text-anchor="middle">转换与校验</text><text x="150" y="82" class="t d" text-anchor="middle">entity → DTO</text><text x="150" y="108" class="t d" text-anchor="middle">业务规则校验</text></g><rect x="170" y="515" width="1060" height="105" rx="16" fill="#f1f5f9"/><text x="700" y="558" class="t b" text-anchor="middle">可解析不等于可信</text><text x="700" y="594" class="t d" text-anchor="middle">类型正确之后，仍需检查枚举、范围、必填字段和业务权限</text><text x="700" y="730" class="t s" text-anchor="middle">第 11 章 · Structured Output</text></svg>
