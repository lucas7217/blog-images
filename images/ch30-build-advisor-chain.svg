<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#f8fafc"/>
  <style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 20px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 16px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
  <text x="800" y="58" text-anchor="middle" class="title">buildAdvisorChain()：把模型调用变成责任链终点</text>
  <text x="800" y="94" text-anchor="middle" class="sub">每次请求收集 Advisor，并分别构建同步链与流式链</text>
  <rect x="80" y="170" width="300" height="155" rx="18" class="blue"/><text x="230" y="215" text-anchor="middle" class="h">请求级 Advisors</text><text x="230" y="254" text-anchor="middle" class="b">Memory · RAG · Logging</text><text x="230" y="290" text-anchor="middle" class="tag">this.advisors</text>
  <rect x="465" y="135" width="330" height="140" rx="18" class="green"/><text x="630" y="180" text-anchor="middle" class="h">ChatModelCallAdvisor</text><text x="630" y="218" text-anchor="middle" class="b">同步模型调用终点</text>
  <rect x="465" y="325" width="330" height="140" rx="18" class="green"/><text x="630" y="370" text-anchor="middle" class="h">ChatModelStreamAdvisor</text><text x="630" y="408" text-anchor="middle" class="b">流式模型调用终点</text>
  <path d="M380 247H430V205H455" class="arr"/><path d="M380 247H430V395H455" class="arr"/>
  <rect x="890" y="170" width="300" height="155" rx="18" class="blue"/><text x="1040" y="215" text-anchor="middle" class="h">pushAll(advisors)</text><text x="1040" y="254" text-anchor="middle" class="b">按 Advisor 类型入链</text><text x="1040" y="290" text-anchor="middle" class="tag">Builder</text>
  <path d="M795 205H850V230H880" class="arr"/><path d="M795 395H850V265H880" class="arr"/>
  <rect x="1260" y="130" width="270" height="145" rx="18" class="box"/><text x="1395" y="175" text-anchor="middle" class="h">Call Chain</text><text x="1395" y="214" text-anchor="middle" class="b">nextCall()</text><text x="1395" y="246" text-anchor="middle" class="tag">同步</text>
  <rect x="1260" y="330" width="270" height="145" rx="18" class="box"/><text x="1395" y="375" text-anchor="middle" class="h">Stream Chain</text><text x="1395" y="414" text-anchor="middle" class="b">nextStream()</text><text x="1395" y="446" text-anchor="middle" class="tag">流式</text>
  <path d="M1190 225H1250" class="arr"/><path d="M1190 270H1225V402H1250" class="arr"/>
  <rect x="270" y="565" width="1060" height="105" rx="16" fill="#e2e8f0"/><text x="800" y="607" text-anchor="middle" class="h">为什么模型也是 Advisor？</text><text x="800" y="643" text-anchor="middle" class="b">统一“前置处理 → 模型执行 → 后置处理”的递归接口，使责任链始终有明确终点</text>
</svg>
