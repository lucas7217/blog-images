<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="1600" height="800" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.red{fill:#fff1f2;stroke:#fb7185;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.loop{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#b)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#2563eb"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">Agent Loop：规划、行动、观察与停止</text><text x="800" y="94" text-anchor="middle" class="sub">每一步都受工具权限、状态机、预算和失败策略约束</text>
<rect x="60" y="250" width="250" height="155" rx="18" class="blue"/><text x="185" y="295" text-anchor="middle" class="h">Goal</text><text x="185" y="335" text-anchor="middle" class="b">用户目标与约束</text><text x="185" y="371" text-anchor="middle" class="tag">输入验证</text>
<rect x="365" y="250" width="250" height="155" rx="18" class="box"/><text x="490" y="295" text-anchor="middle" class="h">Plan</text><text x="490" y="335" text-anchor="middle" class="b">下一步或步骤草案</text><text x="490" y="371" text-anchor="middle" class="tag">可动态修正</text>
<rect x="670" y="250" width="250" height="155" rx="18" class="orange"/><text x="795" y="295" text-anchor="middle" class="h">Select Tool</text><text x="795" y="335" text-anchor="middle" class="b">能力与参数候选</text><text x="795" y="371" text-anchor="middle" class="tag">Allowlist</text>
<rect x="975" y="250" width="250" height="155" rx="18" class="green"/><text x="1100" y="295" text-anchor="middle" class="h">Execute</text><text x="1100" y="335" text-anchor="middle" class="b">授权 · 校验 · 调用</text><text x="1100" y="371" text-anchor="middle" class="tag">Tool Gateway</text>
<rect x="1280" y="250" width="260" height="155" rx="18" class="box"/><text x="1410" y="295" text-anchor="middle" class="h">Observe</text><text x="1410" y="335" text-anchor="middle" class="b">结果进入工作记忆</text><text x="1410" y="371" text-anchor="middle" class="tag">状态更新</text>
<path d="M310 327H355" class="arr"/><path d="M615 327H660" class="arr"/><path d="M920 327H965" class="arr"/><path d="M1225 327H1270" class="arr"/><path d="M1410 415V495H490V415" class="loop"/><text x="950" y="485" text-anchor="middle" class="tag">未完成且预算允许 → 下一轮规划</text>
<rect x="245" y="585" width="330" height="125" rx="18" class="green"/><text x="410" y="628" text-anchor="middle" class="h">Success</text><text x="410" y="668" text-anchor="middle" class="b">目标完成并生成最终结果</text><rect x="635" y="585" width="330" height="125" rx="18" class="red"/><text x="800" y="628" text-anchor="middle" class="h">Need Approval</text><text x="800" y="668" text-anchor="middle" class="b">高风险动作暂停等待确认</text><rect x="1025" y="585" width="330" height="125" rx="18" class="red"/><text x="1190" y="628" text-anchor="middle" class="h">Failed / Budget Stop</text><text x="1190" y="668" text-anchor="middle" class="b">可恢复状态与原因</text><path d="M1410 405V545H410V575" class="arr"/><path d="M1410 545H800V575" class="arr"/><path d="M1410 545H1190V575" class="arr"/>
<rect x="300" y="748" width="1000" height="38" rx="10" fill="#e2e8f0"/><text x="800" y="774" text-anchor="middle" class="b">停止条件必须由应用状态机判断：完成、需确认、不可恢复失败、超时、步数或成本上限</text></svg>
