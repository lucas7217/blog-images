<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810"><rect width="1600" height="810" fill="#f8fafc"/><style>.title{font:700 34px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.sub{font:400 18px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#64748b}.h{font:700 19px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#0f172a}.b{font:400 15px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#475569}.tag{font:600 14px 'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#1d4ed8}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2.5}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:2.5}.orange{fill:#fff7ed;stroke:#fb923c;stroke-width:2.5}.red{fill:#fff1f2;stroke:#fb7185;stroke-width:2.5}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#64748b"/></marker></defs>
<text x="800" y="58" text-anchor="middle" class="title">AI 应用纵深安全</text><text x="800" y="94" text-anchor="middle" class="sub">把用户输入、检索内容和模型输出都视为不可信数据，权限由服务端确定性策略执行</text>
<rect x="45" y="220" width="230" height="155" rx="18" class="red"/><text x="160" y="265" text-anchor="middle" class="h">不可信输入</text><text x="160" y="305" text-anchor="middle" class="b">User · Web · RAG</text><text x="160" y="341" text-anchor="middle" class="tag">Injection / Exfiltration</text><rect x="320" y="170" width="260" height="255" rx="20" class="orange"/><text x="450" y="215" text-anchor="middle" class="h">Input Guard</text><text x="450" y="258" text-anchor="middle" class="b">身份与租户</text><text x="450" y="295" text-anchor="middle" class="b">长度与类型</text><text x="450" y="332" text-anchor="middle" class="b">恶意指令检测</text><text x="450" y="369" text-anchor="middle" class="b">数据分类</text><text x="450" y="401" text-anchor="middle" class="tag">不靠 Prompt 单点防护</text><rect x="625" y="170" width="350" height="255" rx="20" class="blue"/><text x="800" y="215" text-anchor="middle" class="h">AI Orchestration</text><text x="800" y="258" text-anchor="middle" class="b">System Prompt</text><text x="800" y="295" text-anchor="middle" class="b">RAG Metadata Filter</text><text x="800" y="332" text-anchor="middle" class="b">Tool Allowlist + AuthZ</text><text x="800" y="369" text-anchor="middle" class="b">预算与状态机</text><text x="800" y="401" text-anchor="middle" class="tag">最小能力原则</text><rect x="1020" y="170" width="260" height="255" rx="20" class="orange"/><text x="1150" y="215" text-anchor="middle" class="h">Output Guard</text><text x="1150" y="258" text-anchor="middle" class="b">Schema 校验</text><text x="1150" y="295" text-anchor="middle" class="b">敏感信息脱敏</text><text x="1150" y="332" text-anchor="middle" class="b">内容安全</text><text x="1150" y="369" text-anchor="middle" class="b">引用与链接校验</text><text x="1150" y="401" text-anchor="middle" class="tag">模型输出不可信</text><rect x="1325" y="220" width="230" height="155" rx="18" class="green"/><text x="1440" y="265" text-anchor="middle" class="h">受控结果</text><text x="1440" y="305" text-anchor="middle" class="b">展示或业务动作</text><text x="1440" y="341" text-anchor="middle" class="tag">Audit</text><path d="M275 297H310" class="arr"/><path d="M580 297H615" class="arr"/><path d="M975 297H1010" class="arr"/><path d="M1280 297H1315" class="arr"/>
<rect x="170" y="540" width="360" height="145" rx="18" class="box"/><text x="350" y="585" text-anchor="middle" class="h">RAG Security</text><text x="350" y="625" text-anchor="middle" class="b">tenant filter · ACL · source trust</text><text x="350" y="660" text-anchor="middle" class="tag">检索前隔离</text><rect x="620" y="540" width="360" height="145" rx="18" class="box"/><text x="800" y="585" text-anchor="middle" class="h">Tool Security</text><text x="800" y="625" text-anchor="middle" class="b">allowlist · authz · idempotency</text><text x="800" y="660" text-anchor="middle" class="tag">执行处再授权</text><rect x="1070" y="540" width="360" height="145" rx="18" class="box"/><text x="1250" y="585" text-anchor="middle" class="h">Data Security</text><text x="1250" y="625" text-anchor="middle" class="b">minimize · encrypt · redact</text><text x="1250" y="660" text-anchor="middle" class="tag">日志与 Provider 边界</text><rect x="255" y="735" width="1090" height="48" rx="12" fill="#e2e8f0"/><text x="800" y="766" text-anchor="middle" class="b">核心原则：Prompt 是行为提示，不是访问控制；任何高风险动作都必须通过普通服务端安全机制</text></svg>
