<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800"><rect width="1400" height="800" fill="#fff"/><style>.t{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#14213d}.h{font-size:42px;font-weight:700}.s{font-size:20px;fill:#64748b}.b{font-size:22px;font-weight:700}.d{font-size:16px;fill:#64748b}.a{font-size:30px;fill:#64748b}</style><text x="76" y="78" class="t" font-size="18" font-weight="700" fill="#2563eb">RAG INTERNAL FLOW</text><text x="700" y="145" class="t h" text-anchor="middle">Query → Retrieval → Augmentation → Generation</text><text x="700" y="184" class="t s" text-anchor="middle">检索决定模型看见什么，增强决定模型如何使用证据</text><g transform="translate(55,300)"><rect width="220" height="140" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="110" y="48" class="t b" text-anchor="middle">Query</text><text x="110" y="82" class="t d" text-anchor="middle">用户问题 / 改写</text></g><text x="295" y="380" class="t a">→</text><g transform="translate(335,300)"><rect width="240" height="140" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/><text x="120" y="48" class="t b" text-anchor="middle">Retrieval</text><text x="120" y="82" class="t d" text-anchor="middle">Retriever + Filter</text><text x="120" y="110" class="t d" text-anchor="middle">List&lt;Document&gt;</text></g><text x="595" y="380" class="t a">→</text><g transform="translate(635,300)"><rect width="260" height="140" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="130" y="48" class="t b" text-anchor="middle">Augmentation</text><text x="130" y="82" class="t d" text-anchor="middle">Context + Prompt</text><text x="130" y="110" class="t d" text-anchor="middle">证据与规则</text></g><text x="915" y="380" class="t a">→</text><g transform="translate(955,300)"><rect width="250" height="140" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="125" y="48" class="t b" text-anchor="middle">Generation</text><text x="125" y="82" class="t d" text-anchor="middle">ChatModel</text><text x="125" y="110" class="t d" text-anchor="middle">Answer</text></g><text x="1225" y="380" class="t a">→</text><g transform="translate(1270,300)"><rect width="90" height="140" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="45" y="60" class="t b" text-anchor="middle">引用</text><text x="45" y="94" class="t d" text-anchor="middle">来源</text></g><rect x="170" y="525" width="1060" height="105" rx="16" fill="#f1f5f9"/><text x="700" y="566" class="t b" text-anchor="middle">RAG 是数据流，不是一个单独 API</text><text x="700" y="601" class="t d" text-anchor="middle">任一阶段质量不足都会影响答案：查询改写、召回、上下文构造和生成约束必须分别评估</text><text x="700" y="730" class="t s" text-anchor="middle">第 24 章 · RAG 工作原理</text></svg>
